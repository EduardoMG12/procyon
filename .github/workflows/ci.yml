name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: go test
        run: go test -race ./...

  # Runs the README's GitHub Actions example so it cannot rot. Two lines
  # differ on purpose: Procyon is installed from the checkout (a PR tests its
  # own code, not the last release), and the spec is a fixture.
  readme-example:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: procyon
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: cd procyon && go install ./cmd/procyon
      - run: procyon lint procyon/testdata/specs/prc001-global-security.yaml --output sarif=procyon.sarif --output markdown=$GITHUB_STEP_SUMMARY
      - run: test -s procyon.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: procyon.sarif
          checkout_path: procyon

  # procyon test --compose against the vulnerable notes API and its fixed
  # twin: startup, port discovery and teardown with a real Docker.
  compose:
    runs-on: ubuntu-latest
    env:
      PROCYON_USER_A_TOKEN: token-alice
      PROCYON_USER_B_TOKEN: token-bob
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build -o procyon ./cmd/procyon
      - name: The vulnerable API fails the run
        run: |
          set +e
          ./procyon test internal/vulnapi/openapi.yaml --compose internal/vulnapi/docker-compose.yml --service api --port 8080 --format json > vulnerable.json
          code=$?
          set -e
          test "$code" = 1
          test "$(jq '.summary.critical' vulnerable.json)" = 4
      - name: The fixed twin passes
        run: FIXED=true ./procyon test internal/vulnapi/openapi.yaml --compose internal/vulnapi/docker-compose.yml --service api --port 8080
      - name: Nothing is left running
        run: test -z "$(docker ps -aq --filter name=procyon-test)"
