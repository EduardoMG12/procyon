name: Benchmark

# procyon test against APIs vulnerable on purpose. Heavy, so not on every PR:
# weekly, and by hand. The public images are run as they are, never copied
# into this repository.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vampi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build -o procyon ./cmd/procyon
      - name: Start VAmPI
        run: |
          docker run -d --name vampi -e vulnerable=1 -p 127.0.0.1:5000:5000 erev0s/vampi:latest
          until curl -sf http://127.0.0.1:5000/ > /dev/null; do sleep 1; done
          curl -sf http://127.0.0.1:5000/createdb
      - name: procyon test
        working-directory: testdata/benchmark/vampi
        run: |
          set +e
          ../../../procyon test ../../corpus/vampi/spec.yml --base-url http://127.0.0.1:5000 \
            --format json --output markdown=procyon.md > report.json
          code=$?
          set -e
          cat procyon.md >> "$GITHUB_STEP_SUMMARY"
          test "$code" = 1
      - name: The known vulnerabilities are found
        working-directory: testdata/benchmark/vampi
        run: |
          found() { jq -e --arg r "$1" --arg o "$2" '.findings | any(.rule.id == $r and .operation == $o)' report.json > /dev/null; }
          found PRC102 "GET /books/v1/{book_title}"      # BOLA on books
          found PRC103 "PUT /users/v1/{username}/email"  # RegexDOS
      - if: always()
        run: docker rm -f vampi

  crapi:
    runs-on: ubuntu-latest
    env:
      CRAPI: https://raw.githubusercontent.com/OWASP/crAPI/b5fc307f3e5f875809b095b771108ef342a33724/deploy/docker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build -o procyon ./cmd/procyon
      - name: Start crAPI
        working-directory: testdata/benchmark/crapi
        run: |
          curl -sfLO "$CRAPI/docker-compose.yml"
          curl -sfLO "$CRAPI/.env"
          docker compose -p crapi up -d --wait
          ./setup.sh
      - name: procyon test
        working-directory: testdata/benchmark/crapi/run
        run: |
          set +e
          ../../../../procyon test ../../../corpus/crapi/spec.json --base-url http://127.0.0.1:8888 \
            --format json --output markdown=procyon.md > report.json
          code=$?
          set -e
          cat procyon.md >> "$GITHUB_STEP_SUMMARY"
          test "$code" = 1
      - name: The known vulnerabilities are found
        working-directory: testdata/benchmark/crapi/run
        run: |
          found() { jq -e --arg r "$1" --arg o "$2" '.findings | any(.rule.id == $r and .operation == $o)' report.json > /dev/null; }
          found PRC101 "GET /workshop/api/shop/orders/{order_id}"  # another user's order, with no account
          found PRC102 "GET /identity/api/v2/vehicle/{vehicleId}/location"  # challenge 1: another user's vehicle
      - if: always()
        working-directory: testdata/benchmark/crapi
        run: docker compose -p crapi down -v

