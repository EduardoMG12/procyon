openapi: 3.0.3
info:
  title: Notes (vulnerable on purpose)
  version: "1"
  description: >
    The acceptance API of `procyon test`. See README.md for what is planted.
servers:
  - url: http://localhost:8080
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Note:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          maxLength: 20
        owner:
          type: string
          readOnly: true
          maxLength: 50
        title:
          type: string
          maxLength: 100
        body:
          type: string
          maxLength: 10000
    NoteInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 100
        body:
          type: string
          maxLength: 10000
      example:
        title: Shopping list
        body: bread, coffee
    Error:
      type: object
      properties:
        error:
          type: string
          maxLength: 500
  parameters:
    NoteID:
      name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 20
paths:
  /health:
    get:
      x-procyon-public: "Container healthcheck, returns no data"
      operationId: health
      responses:
        "200":
          description: The API is up.
  /login:
    post:
      x-procyon-public: "Signing in needs no account yet"
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 50
                password:
                  type: string
                  format: password
                  maxLength: 100
      responses:
        "200":
          description: The account's token, under session.token.
        "401":
          description: Wrong username or password.
  /me:
    get:
      operationId: me
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    maxLength: 50
        "401":
          description: No valid token.
  /notes:
    get:
      operationId: listNotes
      responses:
        "200":
          description: The caller's notes.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          description: No valid token.
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: The new note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: The body is not a valid note.
  /notes/{id}:
    parameters:
      - $ref: "#/components/parameters/NoteID"
    get:
      operationId: getNote
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: No such note, or not the caller's.
    put:
      operationId: updateNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "200":
          description: The changed note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: No such note, or not the caller's.
    delete:
      operationId: deleteNote
      responses:
        "204":
          description: Deleted.
        "404":
          description: No such note, or not the caller's.
  /notes/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/NoteID"
    get:
      operationId: previewNote
      responses:
        "200":
          description: The note's title and the start of its body.
          content:
            application/json:
              schema: {type: object, properties: {id: {type: string, maxLength: 20}, title: {type: string, maxLength: 100}, start: {type: string, maxLength: 20}}}
        "404":
          description: No such note, or not the caller's.
  /owner-notes:
    get:
      operationId: listNotesOfOwner
      parameters:
        - name: owner
          in: query
          required: true
          description: Whose notes, by name.
          schema:
            type: string
            maxLength: 50
      responses:
        "200":
          description: The owner's notes.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/Note"
        "400":
          description: No owner given.
        "404":
          description: No such owner, or not the caller.
  /menu:
    get:
      operationId: menu
      responses:
        "200":
          description: What the shop sells, the same for every user.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {type: object, properties: {id: {type: string, maxLength: 20}, name: {type: string, maxLength: 100}}}
  /orders:
    get:
      operationId: listOrders
      responses:
        "200":
          description: The caller's orders.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {type: object, properties: {id: {type: string, maxLength: 20}, item: {type: string, maxLength: 100}, address: {type: string, maxLength: 200}}}
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: {type: object, properties: {id: {type: string, maxLength: 20}, item: {type: string, maxLength: 100}, address: {type: string, maxLength: 200}}}
        "404":
          description: No such order, or not the caller's.
