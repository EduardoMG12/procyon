openapi: 3.0.3
info:
  title: Shop
  version: 1.0.0
security:
  - bearer: []
paths:
  /users:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /sessions:
    get:
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/User"
                    - type: object
                      properties:
                        accessToken:
                          type: string
                        tokenExpiresAt:
                          type: string
                        tokenType:
                          type: string
  /tokens:
    post:
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      properties:
        name:
          type: string
        userPassword:
          type: string
        password_hash:
          type: string
        api-token:
          type: string
        APIKey:
          type: string
        senhaUsuario:
          type: string
        passwordPolicy:
          type: string
        passwordSet:
          type: boolean
        tokenizer:
          type: string
        secretary:
          type: string
        privateKey:
          type: string
        nextPageToken:
          type: string
        apiKeyId:
          type: string
        tokenData:
          type: string
        senhaEmTextoPlano:
          type: string
        apiKeys:
          type: array
          items:
            type: string
        clientSecrets:
          type: array
          items:
            type: string
        recoveryPassword:
          $ref: "#/components/schemas/Opaque"
        signingSecret:
          $ref: "#/components/schemas/Opaque"
        manager:
          $ref: "#/components/schemas/User"
        profile:
          type: object
          properties:
            secret:
              type: string
    Opaque:
      type: string
