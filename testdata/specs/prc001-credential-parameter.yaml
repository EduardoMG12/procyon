openapi: 3.0.3
info:
  title: Shop
  version: 1.0.0
paths:
  /orders:
    get:
      parameters:
        - name: x-access-token
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Orders
  /profile:
    parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          maxLength: 200
    get:
      responses:
        "200":
          description: Profile
  /search:
    get:
      parameters:
        - name: api_key
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Results
  /items:
    get:
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Items
  /cart:
    get:
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Cart
  /password/reset:
    post:
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "204":
          description: Reset
  /signup:
    post:
      parameters:
        - name: captchaToken
          in: query
          required: true
          schema:
            type: string
            maxLength: 500
        - name: X-Request-Token
          in: header
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "201":
          description: Signed up
