openapi: 3.1.0
info:
  title: Every way a token is sent
  version: "1"
security:
  - bearer: []
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
    basic: {type: http, scheme: basic}
    key: {type: apiKey, in: header, name: X-API-Key}
    cookie: {type: apiKey, in: cookie, name: session}
    oauth: {type: oauth2, flows: {clientCredentials: {tokenUrl: /token, scopes: {}}}}
    mtls: {type: mutualTLS}
paths:
  /default:
    get: {responses: {"200": {description: ok}}}
  /basic:
    get: {security: [{basic: []}], responses: {"200": {description: ok}}}
  /key:
    get: {security: [{key: []}], responses: {"200": {description: ok}}}
  /cookie:
    get: {security: [{cookie: []}], responses: {"200": {description: ok}}}
  /oauth:
    get: {security: [{oauth: []}], responses: {"200": {description: ok}}}
  /both-then-key:
    get: {security: [{bearer: [], key: []}, {key: []}], responses: {"200": {description: ok}}}
  /mtls:
    get: {security: [{mtls: []}], responses: {"200": {description: ok}}}
  /none:
    get: {security: [], responses: {"200": {description: ok}}}
  /param:
    get:
      security: []
      parameters: [{name: x-access-token, in: header, required: true, schema: {type: string}}]
      responses: {"200": {description: ok}}
