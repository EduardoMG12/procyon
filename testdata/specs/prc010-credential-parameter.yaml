openapi: 3.0.3
info:
  title: Shop
  version: 1.0.0
paths:
  /orders:
    get:
      parameters:
        - name: X-Api-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Orders
  /admin/users:
    delete:
      parameters:
        - name: X-Admin-Api-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "204":
          description: Deleted
  /admin/orders:
    delete:
      parameters:
        - name: X-Api-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "204":
          description: Deleted
