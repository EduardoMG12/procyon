openapi: 3.0.3
info:
  title: Shop
  version: 1.0.0
security:
  - key: []
paths:
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: User
  /users/{name}:
    delete:
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      responses:
        "204":
          description: Deleted
components:
  securitySchemes:
    key:
      type: apiKey
      in: header
      name: X-Key
