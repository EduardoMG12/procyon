openapi: 3.0.3
info:
  title: Webhooks
  version: 1.0.0
security:
  - key: []
paths:
  /webhooks:
    post:
      responses:
        "201":
          description: Created, with its signing secret, shown only here
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  segredoAssinatura:
                    type: string
                  password:
                    type: string
                  privateKey:
                    type: string
  /webhooks/{id}/rotate-secret:
    post:
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The new secret, shown only here
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
  /webhooks/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
    get:
      responses:
        "200":
          description: The webhook
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
    patch:
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
components:
  securitySchemes:
    key:
      type: apiKey
      in: header
      name: X-Key
